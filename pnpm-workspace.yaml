packages:
  - client
  - deps/hljs

# react-scripts 4 expects a flat node_modules layout like Yarn 1 created.
nodeLinker: hoisted

# None of these install scripts are needed for the browser build:
# the native addons have JavaScript fallbacks, the rest only print messages.
allowBuilds:
  bufferutil: false
  core-js: false
  ejs: false
  es5-ext: false
  fsevents: false
  keccak: false
  secp256k1: false
  utf-8-validate: false
  web3: false
  web3-bzz: false
  web3-shh: false
